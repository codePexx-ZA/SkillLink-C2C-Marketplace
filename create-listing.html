<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillLink — Create Listing</title>
    <link rel="stylesheet" href="listing-form.css">
</head>
<body class="listing-form-page">
    <nav class="nav-bar market-nav">
        <label class="hamburger" for="menu-toggle-create-listing">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <input type="checkbox" id="menu-toggle-create-listing" class="menu-toggle">
        <div class="nav-menu">
            <a href="market.html">Home</a>
            <a href="profile.html">Profile</a>
            <a href="OrdersPage.html">Orders</a>
            <a href="ContactUs.html">Contact Us</a>
            <div class="nav-menu-footer">
                <a href="index.html">Log Out</a>
            </div>
        </div>
        <a href="market.html" class="logo">SkillLink</a>
    </nav>

    <main class="listing-form-main">
        <header class="listing-form-header">
            <h1>Create a Listing</h1>
            <p>Add a service listing for buyers to find on the market.</p>
        </header>

        <form class="listing-form-card" action="market.html" method="get">
            <h2>Listing details</h2>

            <div class="form-group">
                <label for="business_name">Business / service name</label>
                <input type="text" id="business_name" name="business_name" placeholder="e.g. Thabo Tree Services">
            </div>

            <div class="form-group">
                <label for="category_id">Service category</label>
                <select id="category_id" name="category_id">
                    <option value="">Select a category</option>
                    <option value="tree-felling">Tree Felling</option>
                    <option value="plumbing">Plumbing</option>
                    <option value="electrical">Electrical</option>
                    <option value="gardening">Gardening</option>
                    <option value="painting">Painting</option>
                    <option value="cleaning">Cleaning</option>
                    <option value="carpentry">Carpentry</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="Describe your service, experience, and what buyers can expect."></textarea>
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" placeholder="e.g. Pretoria East">
            </div>

            <div class="form-row two-cols">
                <div class="form-group">
                    <label for="price_amount">Price (ZAR)</label>
                    <input type="number" id="price_amount" name="price_amount" min="0.01" step="0.01" placeholder="350.00">
                </div>
                <div class="form-group">
                    <label for="price_unit">Price unit</label>
                    <select id="price_unit" name="price_unit">
                        <option value="">Select unit</option>
                        <option value="per hour">per hour</option>
                        <option value="per job">per job</option>
                        <option value="per visit">per visit</option>
                        <option value="per project">per project</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="listing_thumbnail">Listing image</label>
                <div class="photo-dropzone photo-dropzone-compact" data-thumbnail-dropzone>
                    <input type="file" id="listing_thumbnail" name="listing_thumbnail" accept="image/jpeg,image/png,image/gif,image/webp">
                    <p class="photo-filename" data-thumbnail-filename>No file selected</p>
                    <p class="photo-placeholder">Click to choose an image</p>
                </div>
                <p class="listing-upload-hint">JPG, PNG, GIF, or WebP — cropped to a standard 4:3 market card size on upload.</p>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Post listing</button>
            </div>
        </form>

        <p class="back-link-wrap">
            <a href="market.html" class="btn-secondary">Back to market</a>
        </p>
    </main>
</body>
</html>
